name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx oxlint src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # The packaged server backs the tests on 6379, and its binary is what
      # the lifecycle harness and owned-Redis fixtures spawn directly.
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          timeout 30 sh -c 'until redis-cli ping; do sleep 1; done'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      # --ignore-scripts skips node-pty's native build, which the PTY tests load.
      - name: Build node-pty
        run: npm rebuild node-pty

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379/15

      - name: Run Python installer tests
        run: npm run test:py
